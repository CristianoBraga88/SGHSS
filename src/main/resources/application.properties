# ========== APPLICATION ==========
spring.application.name=sghss-api

# ========== DATABASE ==========
spring.datasource.url=jdbc:mysql://localhost:3306/sghss_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Sua_Senha_Aqui}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA/HIBERNATE ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Adicione esta linha para melhor suporte a UUID:
spring.jpa.properties.hibernate.id.uuid_generation_strategy=org.hibernate.id.UUIDGenerator

# ========== JWT ==========
app.jwt.secret=${JWT_SECRET:suaChaveSecretaSuperForteComPeloMenos32Caracteres1234567890ABCDEF!}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ========== SERVER ==========
server.port=8080
server.error.include-stacktrace=on-param
server.error.include-message=always
server.error.include-binding-errors=always

# ========== LOGGING ==========
logging.level.br.com.vidaplus.sghss=INFO
logging.level.br.com.vidaplus.sghss.security=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=ERROR
# Adicione para ver mais detalhes do JPA:
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========== SPRING DEVTOOLS ==========
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.jpa.open-in-view=false
