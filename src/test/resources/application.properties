# Configuração usada apenas nos testes automatizados (banco H2 em memória)
spring.application.name=sghss-api-test

spring.datasource.url=jdbc:h2:mem:sghss_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=chaveDeTesteComMaisDe32CaracteresParaAssinaturaJWT123456
app.jwt.expiration=3600000
app.jwt.refresh-expiration=7200000
